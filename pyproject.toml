[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensuse-infra-harness"
version = "0.1.0"
description = "POC autonomous OpenSUSE host SRE loop with OpenRouter and Discord"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
infra-harness = "harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
